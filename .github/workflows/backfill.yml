name: backfill-prices

# 過去の株価を遡って BigQuery に入れる一回限りの手動ワークフロー(src/backfill.py)。
# 日次更新の設定は変えない。実行は手動のみ。最初は dry_run=true で内容を確認する。
on:
  workflow_dispatch:
    inputs:
      start:
        description: "遡る開始日"
        default: "2020-01-01"
      dry_run:
        description: "true なら取得と検査だけ行い、BigQuery には反映しない"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: daily-update      # 日次更新と同時に走らせない
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Backfill prices
        env:
          START: ${{ inputs.start }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          echo "start=$START dry_run=$DRY_RUN"
          if [ "$DRY_RUN" = "true" ]; then
            python src/backfill.py --start "$START" --dry-run
          else
            echo "本実行: BigQuery に反映します"
            python src/backfill.py --start "$START"
          fi
