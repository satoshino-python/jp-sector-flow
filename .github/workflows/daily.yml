name: daily-update

on:
  schedule:
    # 平日 16:37 JST (= 07:37 UTC)。東証の大引けは15:30。
    # GitHub の cron は毎時0分・30分に混み、遅れたり飛ばされたりするので、混まない分(37)にずらし、
    # 20分後(16:57 JST)にもう一度かける。2回目は gate ジョブが、当日分が入っていればスキップする
    - cron: "37 7 * * 1-5"
    - cron: "57 7 * * 1-5"
  workflow_dispatch: {}   # 手動実行用
  push:
    # trigger/run.txt を更新してpushすると再実行される(自動化からの再実行用。gh が使えない環境向け)
    branches: [main]
    paths: [trigger/run.txt]

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

env:
  # 対象銘柄の範囲。topix500(Core30+Large70+Mid400)で数週間運用し、問題なければ all(TOPIX全銘柄)に変える
  UNIVERSE_SCOPE: topix500

jobs:
  gate:
    # スケジュール起動のとき、当日分がすでに BigQuery に入っていれば本体をスキップする(手動・pushでは常に実行)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-cloud-bigquery pandas
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Check whether today is already loaded
        id: check
        run: python src/gate.py

  update:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # 銘柄を増やした直後は全期間の取得が入るため長めにとる(通常は数分)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 株価の保存先は BigQuery。最初に認証し、直近分を作業用の data/prices.parquet に読み出す
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Update universe from JPX TOPIX weights
        # 失敗しても前回の銘柄リストで続行し、最後にジョブを失敗させて気づけるようにする
        id: universe
        continue-on-error: true
        run: python src/universe.py

      - name: Load prices from BigQuery
        run: python src/bq_sync.py --pull --require

      - name: Fetch prices (incremental)
        run: python src/fetch.py

      - name: Fetch fund NAV (best effort)
        # 終値との突き合わせ用。失敗しても終値のみで続行する
        continue-on-error: true
        run: python src/fetch_nav.py

      - name: Build dashboard
        run: python src/dashboard.py

      - name: Save to BigQuery
        run: python src/bq_sync.py --require

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in data/summary.csv docs/index.html data/universe.csv data/topix_weights.csv; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "update: $(date -u +%Y-%m-%d)"
            # 実行中に trigger/run.txt などが push されていても取り込んでから push する
            git pull --rebase origin main
            git push
          fi

      - name: Build and publish snapshot data
        # 共有用アーティファクト(スナップショット版)に埋め込むデータ。失敗しても本体の更新には影響させない。
        # 履歴を溜めないよう、孤立ブランチ snapshot に1コミットだけ強制pushする(main には入れない)
        continue-on-error: true
        run: |
          python src/snapshot.py
          d="$(mktemp -d)"
          cp data/snapshot.json "$d/"
          cd "$d"
          git init -q -b snapshot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshot.json
          git commit -qm "snapshot: $(date -u +%Y-%m-%d)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" snapshot

      - name: Fail if universe update did not succeed
        if: steps.universe.outcome != 'success'
        run: |
          echo "::error::TOPIX構成銘柄の更新に失敗しました(前回の銘柄リストで実行済み)。universe.py のログを確認してください"
          exit 1
