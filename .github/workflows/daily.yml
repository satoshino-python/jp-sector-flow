name: daily-update

on:
  schedule:
    # 平日 16:30 JST (= 07:30 UTC)。東証の大引けは15:30。実行は数分〜十数分遅れることがある
    - cron: "30 7 * * 1-5"
  workflow_dispatch: {}   # 手動実行用

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch prices (incremental)
        run: python src/fetch.py

      - name: Fetch fund NAV (best effort)
        # 終値との突き合わせ用。失敗しても終値のみで続行する
        continue-on-error: true
        run: python src/fetch_nav.py

      - name: Build dashboard
        run: python src/dashboard.py

      # --- BigQuery への反映(当面はparquetと並行。失敗してもダッシュボード公開は続けるが、最後にジョブを失敗させて気づけるようにする) ---
      - name: Authenticate to Google Cloud
        id: gcp_auth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Sync to BigQuery
        id: bq
        if: steps.gcp_auth.outcome == 'success'
        continue-on-error: true
        run: python src/bq_sync.py --require

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.parquet data/summary.csv docs/index.html
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "update: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Fail if BigQuery sync did not succeed
        if: steps.gcp_auth.outcome != 'success' || steps.bq.outcome != 'success'
        run: |
          echo "::error::BigQueryへの反映に失敗しました(認証: ${{ steps.gcp_auth.outcome }} / 同期: ${{ steps.bq.outcome }})。ログを確認してください"
          exit 1
