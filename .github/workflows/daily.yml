name: daily-update

on:
  schedule:
    # 平日 16:30 JST (= 07:30 UTC)。東証の大引けは15:30。実行は数分〜十数分遅れることがある
    - cron: "30 7 * * 1-5"
  workflow_dispatch: {}   # 手動実行用

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch prices (incremental)
        run: python src/fetch.py

      - name: Fetch fund NAV (best effort)
        # 終値との突き合わせ用。失敗しても終値のみで続行する
        continue-on-error: true
        run: python src/fetch_nav.py

      - name: Build dashboard
        run: python src/dashboard.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.parquet data/summary.csv docs/index.html
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "update: $(date -u +%Y-%m-%d)"
            git push
          fi
