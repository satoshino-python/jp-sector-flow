name: minervini-screen

# ミネルヴィニのスクリーナー(src/minervini.py)を BigQuery の株価で実行し、結果を BigQuery の minervini_screen に保存する。
# 毎日の実行は daily-update が行う。こちらは過去の日付での実行(as_of)と、スクリーナーを変更したブランチでの確認用。
# ブランチへの push でも動き、その時点のコードで当日分を上書きする
on:
  workflow_dispatch:
    inputs:
      as_of:
        description: "判定日(YYYY-MM-DD)。空なら最新"
        required: false
  push:
    branches-ignore: [main, snapshot]
    paths: [src/minervini.py, .github/workflows/minervini.yml]

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Screen and save to BigQuery
        # 結果は BigQuery の minervini_screen に (as_of, code) をキーに保存する(同じ日の再実行は上書き)
        env:
          AS_OF: ${{ inputs.as_of }}
        run: |
          mkdir -p out
          if [ -n "$AS_OF" ]; then
            python src/minervini.py --bq --save --as-of "$AS_OF" --equity 5000000 --out "out/minervini_$AS_OF.csv"
          else
            python src/minervini.py --bq --save --equity 5000000 --out out/minervini.csv
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: minervini
          path: out/*.csv
