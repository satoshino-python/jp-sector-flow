name: minervini-screen

# ミネルヴィニのスクリーナー(src/minervini.py)を BigQuery の株価で実行し、結果を成果物(artifact)として残す。
# 手動実行のほか、スクリーナーを変更したブランチへの push でも動く(実データでの検証用)
on:
  workflow_dispatch:
    inputs:
      as_of:
        description: "判定日(YYYY-MM-DD)。空なら最新"
        required: false
  push:
    branches-ignore: [main, snapshot]
    paths: [src/minervini.py, .github/workflows/minervini.yml]

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Screen
        env:
          AS_OF: ${{ inputs.as_of }}
        run: |
          mkdir -p out
          if [ -n "$AS_OF" ]; then
            python src/minervini.py --bq --as-of "$AS_OF" --equity 5000000 --out "out/minervini_$AS_OF.csv"
          else
            python src/minervini.py --bq --equity 5000000 --out out/minervini.csv
          fi

      - name: Screen past dates (push only, for checking)
        if: github.event_name == 'push'
        run: |
          for d in 2026-03-31 2026-06-30 2026-09-01; do
            echo "=== $d ==="
            python src/minervini.py --bq --as-of "$d" --equity 5000000 --out "out/minervini_$d.csv"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: minervini
          path: out/
