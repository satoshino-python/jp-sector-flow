<title>VCPスクリーニング検証</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 構成: 見出しと件数 → 左に銘柄リスト(VCP判定 / 不合格の理由で絞り込み)、右に選んだ銘柄のチャートと判定の内訳。
   色は業種ダッシュボード(snapshot.template.html)と同じ系統。日本の慣習に合わせ、赤が陽線、青が陰線。 */
:root{
  --bg:#f9f9f7; --surface:#fcfcfb; --fg:#0b0b0b; --fg2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --line:rgba(11,11,11,.10); --wash:rgba(42,120,214,.08); --base:rgba(42,120,214,.07);
  --pos:#e66767; --neg:#6da7ec;
  --ma50:#1baf7a; --ma150:#eda100; --ma200:#4a3aa7; --pivot:#eb6834; --stop:#0b0b0b; --target:#008300; --zz:#52514e;
  --ok:#008300; --ng:#c42b2b; --warn:#b45309; --focus:#2a78d6;
  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d0d0d; --surface:#1a1a19; --fg:#ffffff; --fg2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --line:rgba(255,255,255,.10); --wash:rgba(57,135,229,.14); --base:rgba(57,135,229,.10);
    --pos:#d45454; --neg:#3d84dc;
    --ma50:#199e70; --ma150:#c98500; --ma200:#9085e9; --pivot:#e8743f; --stop:#ffffff; --target:#3fb950; --zz:#c3c2b7;
    --ok:#3fb950; --ng:#ff6b6b; --warn:#fab219; --focus:#3987e5; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d0d0d; --surface:#1a1a19; --fg:#ffffff; --fg2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --line:rgba(255,255,255,.10); --wash:rgba(57,135,229,.14); --base:rgba(57,135,229,.10);
  --pos:#d45454; --neg:#3d84dc;
  --ma50:#199e70; --ma150:#c98500; --ma200:#9085e9; --pivot:#e8743f; --stop:#ffffff; --target:#3fb950; --zz:#c3c2b7;
  --ok:#3fb950; --ng:#ff6b6b; --warn:#fab219; --focus:#3987e5; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.6 var(--sans);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 48px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:22px;line-height:1.3;margin:0;font-weight:700}
h2{font-size:15px;margin:0;font-weight:700;text-wrap:balance}
h3{font-size:13px;margin:0;font-weight:700;color:var(--fg2);letter-spacing:.04em}
.note{color:var(--fg2);font-size:12px;margin:0}
.muted{color:var(--muted)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}

header{display:flex;flex-wrap:wrap;gap:10px 28px;align-items:flex-end;justify-content:space-between}
.counts{display:flex;flex-wrap:wrap;gap:4px 22px;font-size:13px;color:var(--fg2)}
.counts b{font-size:20px;color:var(--fg);font-variant-numeric:tabular-nums;margin-right:2px}

.layout{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}

.seg{display:inline-flex;border:1px solid var(--axis);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg button{background:transparent;border:0;padding:4px 11px;font-size:12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--axis)}
.seg button[aria-pressed="true"]{background:var(--wash);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--axis);background:transparent;border-radius:14px;padding:1px 9px;font-size:11px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--fg2);background:var(--wash);font-weight:700}

.list{max-height:70vh;overflow:auto;border-top:1px solid var(--grid)}
@media (max-width:900px){.list{max-height:42vh}}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
th,td{padding:6px 6px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--grid)}
th{font-weight:600;color:var(--fg2);font-size:11px;position:sticky;top:0;background:var(--surface);z-index:1}
th:first-child,td:first-child{text-align:left}
td.wrap{white-space:normal}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--wash)}
tr.sel td{background:var(--wash);box-shadow:inset 0 -2px 0 var(--focus)}
.nm{display:flex;flex-direction:column;gap:2px;line-height:1.3;min-width:9em}
td.wrap .pill.no{font-size:11px}
.nm small{color:var(--muted);font-size:11px}
.pill{display:inline-block;border-radius:10px;padding:0 7px;font-size:11px;line-height:18px;white-space:nowrap}
.pill.go{background:color-mix(in srgb,var(--pos) 22%,transparent);color:var(--fg)}
.pill.wait{background:color-mix(in srgb,var(--ma150) 24%,transparent);color:var(--fg)}
.pill.skip{background:color-mix(in srgb,var(--muted) 22%,transparent);color:var(--fg2)}
.pill.no{color:var(--fg2);padding:0;white-space:normal}
.mark{font-size:11px;font-weight:700}
.mark.ok{color:var(--ok)} .mark.ng{color:var(--ng)} .mark.q{color:var(--warn)}

.detail-head{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;justify-content:space-between}
.detail-title{font-size:18px;font-weight:700}
.detail-title small{font-size:13px;color:var(--muted);font-weight:400;margin-left:6px}
.tools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.key{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11px;color:var(--fg2)}
.key span{display:inline-flex;align-items:center;gap:5px}
.key i{display:inline-block;width:16px;height:0;border-top:2px solid}
.key i.box{width:10px;height:10px;border:0;border-radius:2px}
.chart{position:relative;min-width:0;touch-action:pan-y;cursor:crosshair}
svg text{font-family:var(--sans);fill:var(--fg2)}
.ax{font-size:11px}
.lbl{font-size:11px;font-weight:700}

.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.cols{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.cols{grid-template-columns:1fr}}
.card{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:12px}
.checks li{display:grid;grid-template-columns:16px 1fr auto;gap:6px;align-items:baseline}
.checks .r{font-variant-numeric:tabular-nums;color:var(--fg2);text-align:right}
.yes{color:var(--ok);font-weight:700} .no{color:var(--ng);font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:12px;margin:0}
.kv dt{color:var(--fg2)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}

.review{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.review .seg button{padding:4px 14px}
.review input{flex:1;min-width:12em;font:inherit;font-size:12px;padding:5px 8px;border:1px solid var(--axis);border-radius:6px;background:var(--bg);color:var(--fg)}
.btn{background:transparent;border:1px solid var(--axis);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12px}
.btn:hover{background:var(--wash)}
.foot{display:flex;flex-direction:column;gap:6px}
.foot p{margin:0;max-width:80ch}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--surface);color:var(--fg);border:1px solid var(--axis);
  border-radius:6px;padding:7px 10px;font-size:12px;box-shadow:0 2px 10px rgba(0,0,0,.18);display:none;min-width:150px}
#tip .tl{font-weight:700;margin-bottom:3px}
#tip .tr{display:flex;gap:12px;justify-content:space-between;white-space:nowrap}
#tip .tr span:first-child{color:var(--fg2)}
#tip .tr span:last-child{font-variant-numeric:tabular-nums;font-weight:600}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>VCPスクリーニング検証</h1>
      <p class="note" id="sub">トレンドテンプレートを通過した銘柄のチャートに、プログラムが検出したベース・収縮・ピボット・損切りを重ねて表示します。</p>
    </div>
    <div class="counts" id="counts"></div>
  </header>

  <div class="layout">
    <section class="panel" aria-label="銘柄リスト">
      <div class="seg" id="tabs" role="group" aria-label="表示する銘柄">
        <button type="button" data-t="vcp" aria-pressed="true">VCP判定</button>
        <button type="button" data-t="rej" aria-pressed="false">VCP不合格</button>
        <button type="button" data-t="near" aria-pressed="false">テンプレート惜しい</button>
      </div>
      <div class="chips" id="reasons" hidden></div>
      <p class="note" id="list-note"></p>
      <div class="list"><table id="list"></table></div>
    </section>

    <section class="panel" id="detail" aria-label="選んだ銘柄"></section>
  </div>

  <section class="panel foot">
    <h2>目視チェックの結果</h2>
    <p class="note">各銘柄の「判定は妥当？」で付けた印とメモは、このブラウザにだけ保存されます。まとめてコピーして、チャットに貼り付けてください。</p>
    <div class="tools"><button class="btn" type="button" id="copy">印とメモをコピー</button><span class="note" id="copy-msg" role="status"></span></div>
    <pre id="copy-src" class="note" hidden></pre>
  </section>

  <section class="foot note">
    <p>価格は株式分割・配当を反映した調整後の値で、取引所の表示価格とは異なります。業績(EPS・売上)は判定に入っていません。</p>
    <p>投資判断の材料の一つであり、売買の推奨ではありません。</p>
  </section>
</div>
<div id="tip" role="tooltip"></div>

<script id="data" type="application/json">__MINERVINI_JSON__</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const P = D.params;
const $ = q => document.querySelector(q);
const NS = "http://www.w3.org/2000/svg";
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) el.append(k.nodeType ? k : String(k));
  return el;
}
function s(tag, attrs, ...kids) {
  const el = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v != null) el.setAttribute(k, v);
  for (const k of kids) if (k != null) el.append(k.nodeType ? k : String(k));
  return el;
}
const fx = (v, d = 1) => v == null || !isFinite(v) ? "-" : Number(v).toLocaleString("ja-JP", {minimumFractionDigits: d, maximumFractionDigits: d});
const fp = v => v == null ? "-" : Math.abs(v) >= 1000 ? Math.round(v).toLocaleString("ja-JP") : fx(v, 1);
const pct = (v, d = 0) => v == null ? "-" : fx(v * 100, d) + "%";
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

/* ---------- 目視チェック(このブラウザだけに保存) ---------- */
const RKEY = "minervini-review-" + D.as_of;
let review = {};
try { review = JSON.parse(localStorage.getItem(RKEY) || "{}") || {}; } catch (e) { review = {}; }
function saveReview() { try { localStorage.setItem(RKEY, JSON.stringify(review)); } catch (e) { /* 保存できなくても表示は続ける */ } }

/* ---------- 状態 ---------- */
const stocks = D.stocks.map(x => ({...x, reasons: (x.vcp_note || "").split(" / ").filter(Boolean)}));
const byCode = Object.fromEntries(stocks.map(x => [x.code, x]));
const reasonKey = r => /^収縮\d+回$/.test(r) ? "収縮回数が範囲外" : r;
const state = {tab: "vcp", reason: null, code: null, bars: innerWidth < 560 ? 63 : 130};
try { const t = localStorage.getItem("minervini-tab"); if (t) state.tab = t; } catch (e) { /* 無視 */ }

function statusClass(st) {
  if (!st) return "no";
  if (st.startsWith("ブレイク") && !st.includes("不足")) return "go";
  if (st.startsWith("ピボット") || st.includes("不足")) return "wait";
  return "skip";
}
const TT_LABELS = [
  ["株価 > 150日線・200日線", x => `${fp(x.close)} / ${fp(x.ma150)} / ${fp(x.ma200)}`],
  ["150日線 > 200日線", x => `${fp(x.ma150)} / ${fp(x.ma200)}`],
  ["200日線が1か月前より上", () => ""],
  ["50日線 > 150日線・200日線", x => `${fp(x.ma50)}`],
  ["株価 > 50日線", x => `${fp(x.close)} / ${fp(x.ma50)}`],
  [`52週安値から +${P.MIN_ABOVE_LOW * 100}%以上`, x => `+${fx(x.pct_from_low52, 0)}%`],
  [`52週高値から −${P.MAX_BELOW_HIGH * 100}%以内`, x => `${fx(x.pct_from_high52, 1)}%`],
  [`RS ${P.MIN_RS}以上`, x => fx(x.rs, 0)],
];
const lastOf = v => Array.isArray(v) ? v[v.length - 1] : v;

/* ---------- 件数 ---------- */
function renderCounts() {
  const nv = stocks.filter(x => x.vcp).length;
  $("#counts").replaceChildren(
    h("span", null, "基準日 ", h("b", {style: "font-size:15px"}, D.as_of)),
    h("span", null, h("b", null, stocks.length), `/ ${D.n_universe} テンプレート通過`),
    h("span", null, h("b", null, nv), "VCP判定"),
    h("span", null, h("b", null, stocks.length - nv), "VCP不合格"));
}

/* ---------- リスト ---------- */
function rows() {
  if (state.tab === "vcp") return stocks.filter(x => x.vcp);
  if (state.tab === "rej") return stocks.filter(x => !x.vcp && (!state.reason || x.reasons.some(r => reasonKey(r) === state.reason)));
  return D.near;
}
function renderTabs() {
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.t === state.tab ? "true" : "false"));
  const box = $("#reasons");
  box.hidden = state.tab !== "rej";
  if (state.tab === "rej") {
    const cnt = {};
    stocks.filter(x => !x.vcp).forEach(x => new Set(x.reasons.map(reasonKey)).forEach(r => cnt[r] = (cnt[r] || 0) + 1));
    const keys = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a]);
    box.replaceChildren(h("button", {class: "chip", type: "button", "aria-pressed": state.reason ? "false" : "true", onclick: () => { state.reason = null; renderList(); }}, "すべて"),
      ...keys.map(k => h("button", {class: "chip", type: "button", "aria-pressed": state.reason === k ? "true" : "false",
        onclick: () => { state.reason = state.reason === k ? null : k; renderList(); }}, `${k} ${cnt[k]}`)));
  }
  $("#list-note").textContent = {
    vcp: "VCPと判定された銘柄。状態はピボットに対する現在位置です。",
    rej: "テンプレートは通過したがVCPにならなかった銘柄。理由で絞り込めます(1銘柄に複数の理由があります)。",
    near: "テンプレート8条件のうち6〜7条件を満たした銘柄。チャートはありません。満たさなかった条件を確かめられます。",
  }[state.tab];
}
function markEl(code) {
  const r = review[code]; if (!r || !r.mark) return "";
  return h("span", {class: "mark " + {ok: "ok", ng: "ng", q: "q"}[r.mark], title: "目視チェック"}, {ok: "妥当", ng: "要修正", q: "保留"}[r.mark]);
}
function renderList() {
  renderTabs();
  const list = rows(), tb = $("#list");
  if (state.tab === "near") {
    tb.replaceChildren(h("thead", null, h("tr", null, h("th", null, "銘柄"), h("th", null, "RS"), h("th", null, "満たさなかった条件"))),
      h("tbody", null, list.map(x => h("tr", {onclick: () => select(x.code, true)}, h("td", null, h("div", {class: "nm"}, x.name, h("small", null, x.code + " " + x.sector))),
        h("td", null, fx(x.rs, 0)), h("td", {class: "wrap", style: "text-align:left"}, x.tt.map((ok, i) => ok ? null : TT_LABELS[i][0]).filter(Boolean).join("、"))))));
    if (!list.length) tb.append(h("tbody", null, h("tr", null, h("td", {colspan: 3}, "該当する銘柄はありません。"))));
    renderNearDetail();
    return;
  }
  tb.replaceChildren(
    h("thead", null, h("tr", null, h("th", null, "銘柄 / " + (state.tab === "vcp" ? "状態" : "理由")), h("th", null, "RS"), h("th", null, "収縮の深さ"))),
    h("tbody", null, list.map(x => h("tr", {class: x.code === state.code ? "sel" : null, "data-code": x.code, onclick: () => select(x.code)},
      h("td", {class: "wrap"}, h("div", {class: "nm"}, h("span", null, x.name, " ", markEl(x.code)), h("small", null, x.code + " " + x.sector),
        h("span", null, x.vcp ? h("span", {class: "pill " + statusClass(x.status)}, x.status) : h("span", {class: "pill no"}, x.reasons.join("、"))))),
      h("td", null, fx(x.rs, 0)),
      h("td", {class: "wrap"}, (x.depths || "-").replaceAll(" → ", "→"))))));
  if (!list.length) tb.append(h("tbody", null, h("tr", null, h("td", {colspan: 3}, "該当する銘柄はありません。"))));
  if (!list.some(x => x.code === state.code)) { if (list.length) select(list[0].code); else $("#detail").replaceChildren(h("p", {class: "note"}, "左のリストに銘柄がありません。")); }
}
function renderNearDetail() {
  $("#detail").replaceChildren(h("h2", null, "トレンドテンプレートの条件別の通過数"),
    h("p", {class: "note"}, `対象 ${D.n_universe} 銘柄のうち、各条件を満たした銘柄数。8条件すべてを満たしたのは ${stocks.length} 銘柄です。`),
    h("ul", {class: "checks"}, TT_LABELS.map(([lab], i) => h("li", null, h("span", null, ""), h("span", null, lab), h("span", {class: "r"}, `${D.tt_counts[i]} 銘柄`)))));
}

/* ---------- 詳細 ---------- */
function select(code, fromNear) {
  if (fromNear) return;
  state.code = code;
  document.querySelectorAll("#list tbody tr").forEach(tr => tr.classList.toggle("sel", tr.dataset.code === code));
  renderDetail();
}
function vcpChecks(x) {
  const d = (x.depths || "").split(" → ").map(t => parseFloat(t) / 100).filter(v => isFinite(v));
  const items = [];
  items.push([`ベースの期間 ${P.MIN_BASE_DAYS}日以上`, x.base_days >= P.MIN_BASE_DAYS, `${x.base_days}日`]);
  if (x.reasons.includes("ベースが短い")) return items;
  items.push([`収縮 ${P.MIN_CONTRACTIONS}〜${P.MAX_CONTRACTIONS}回`, d.length >= P.MIN_CONTRACTIONS && d.length <= P.MAX_CONTRACTIONS, `${d.length}回`]);
  if (!d.length) return items;
  items.push([`最初の収縮 ${P.MAX_FIRST_DEPTH * 100}%以内`, d[0] <= P.MAX_FIRST_DEPTH + 0.005, pct(d[0])]);
  items.push([`最後の収縮 ${P.MAX_FINAL_DEPTH * 100}%以内`, !x.reasons.includes("最後の収縮が深い"), pct(d[d.length - 1])]);
  items.push(["だんだん浅くなる", !x.reasons.includes("収縮が浅くなっていない"), x.depths]);
  items.push([`最後 ≤ 最初の${P.FINAL_VS_FIRST * 100}%`, !x.reasons.includes("収縮の縮み不足"), d.length > 1 ? `${fx(d[d.length - 1] / d[0] * 100, 0)}%` : "-"]);
  items.push([`直近${P.DRYUP_DAYS}日の出来高 ≤ 50日平均の${P.MAX_DRYUP_RATIO * 100}%`, !x.reasons.includes("出来高が細っていない"), x.dryup == null ? "-" : `${fx(x.dryup * 100, 0)}%`]);
  return items;
}
function checkList(items) {
  return h("ul", {class: "checks"}, items.map(([lab, ok, val]) => h("li", null, h("span", {class: ok ? "yes" : "no", "aria-label": ok ? "満たす" : "満たさない"}, ok ? "✓" : "✗"), h("span", null, lab), h("span", {class: "r"}, val))));
}
function renderDetail() {
  const x = byCode[state.code], box = $("#detail");
  if (!x) return;
  const ranges = [["3か月", 63], ["6か月", 130], ["1年", 250]];
  const r = review[x.code] || {};
  box.replaceChildren(
    h("div", {class: "detail-head"},

        h("span", null, h("i", {style: "border-color:var(--zz);border-top-style:dashed"}), "検出した収縮"), h("span", null, h("i", {style: "border-color:var(--pivot)"}), "ピボット"),

/* ---------- チャート ---------- */
let CH = null;
function drawChart(x) {
  const wrap = $("#chart"); if (!wrap) return;
  const len = x.c.length, n = Math.min(state.bars, len), i0 = len - n;
  const W = Math.max(300, wrap.clientWidth || 700), narrow = W < 560;
  const mg = {l: 8, r: narrow ? 52 : 64, t: 12, b: 24}, H1 = narrow ? 240 : 330, H2 = 70, gap = 10;
  const pTop = mg.t, pBot = pTop + H1, vTop = pBot + gap, vBot = vTop + H2, H = vBot + mg.b;
  const plotW = W - mg.l - mg.r, sw = plotW / n, X = j => mg.l + (j - i0 + 0.5) * sw;
  const vals = [];
  for (let i = i0; i < len; i++) { if (x.h[i] != null) vals.push(x.h[i]); if (x.l[i] != null) vals.push(x.l[i]); }
  if (x.vcp) vals.push(x.stop, x.target_2r);
  if (x.pivot != null) vals.push(x.pivot);
  for (const m of [x.m50, x.m150, x.m200]) for (let i = i0; i < len; i++) if (m[i] != null) vals.push(m[i]);
  let lo = Math.min(...vals), hi = Math.max(...vals); const pad = (hi - lo) * 0.05 || 1; lo -= pad; hi += pad;
  const ly = Math.log, Y = v => pBot - (ly(v) - ly(lo)) / (ly(hi) - ly(lo)) * (pBot - pTop);   // 対数目盛(収縮の深さを見比べやすくする)
  const svg = s("svg", {width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": `${x.name}のローソク足、移動平均、検出した収縮とピボット`});
  // 目盛
  const ticks = niceTicks(lo, hi, narrow ? 4 : 6);
  ticks.forEach(t => svg.append(s("line", {x1: mg.l, x2: W - mg.r, y1: Y(t), y2: Y(t), stroke: "var(--grid)"}),
    s("text", {class: "ax", x: W - mg.r + 6, y: Y(t) + 4}, fp(t))));
  // ベース
  if (x.start != null) {
    const a = Math.max(x.start, i0);
    if (a < len) svg.append(s("rect", {x: X(a) - sw / 2, y: pTop, width: X(len - 1) - X(a) + sw, height: pBot - pTop, fill: "var(--base)"}));
    if (x.start >= i0) svg.append(s("text", {class: "ax", x: X(x.start) + 3, y: pBot - 6}, `ベース ${x.base_days}日`));
  }
  // 移動平均
  [["m200", "--ma200"], ["m150", "--ma150"], ["m50", "--ma50"]].forEach(([k, c]) => {
    let d = "", on = false;
    for (let i = i0; i < len; i++) { const v = x[k][i]; if (v == null) { on = false; continue; } d += (on ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1); on = true; }
    svg.append(s("path", {d, fill: "none", stroke: `var(${c})`, "stroke-width": 1.5, opacity: .9}));
  });
  // ローソク足
  const bw = Math.max(1, Math.min(9, sw * 0.65));
  for (let i = i0; i < len; i++) {
    const o = x.o[i] ?? x.c[i - 1] ?? x.c[i], c = x.c[i]; if (c == null) continue;
    const col = c >= o ? "var(--pos)" : "var(--neg)";
    svg.append(s("line", {x1: X(i), x2: X(i), y1: Y(x.h[i] ?? c), y2: Y(x.l[i] ?? c), stroke: col}),
      s("rect", {x: X(i) - bw / 2, y: Math.min(Y(o), Y(c)), width: bw, height: Math.max(1, Math.abs(Y(o) - Y(c))), fill: col}));
  }
  // 検出した収縮(ZigZag)
  const zz = (x.zz || []).filter(p => p[1] >= i0);
  if (zz.length > 1) {
    svg.append(s("path", {d: zz.map((p, k) => (k ? "L" : "M") + X(p[1]).toFixed(1) + " " + Y(p[2]).toFixed(1)).join(""), fill: "none", stroke: "var(--zz)", "stroke-width": 1.5, "stroke-dasharray": "5 3"}));
    const all = x.zz || [];
    all.forEach((p, k) => {
      if (p[1] < i0) return;
      const last = k === all.length - 1;
      svg.append(s("circle", {cx: X(p[1]), cy: Y(p[2]), r: 3.2, fill: last ? "var(--surface)" : "var(--zz)", stroke: "var(--zz)", "stroke-width": 1.5}));
      if (p[0] === "L" && k > 0 && all[k - 1][0] === "H") {

        svg.append(s("text", {class: "lbl", x: X(p[1]), y: Y(p[2]) + 15, "text-anchor": "middle", style: "fill:var(--fg)"}, "−" + fx(dep * 100, 0) + "%"));
      }

  }
  // ピボット・損切り・目標
  const hline = (v, col, dash, label) => {
    if (v == null) return;
    svg.append(s("line", {x1: mg.l, x2: W - mg.r, y1: Y(v), y2: Y(v), stroke: `var(${col})`, "stroke-width": 1.5, "stroke-dasharray": dash}));
    const t = `${label} ${fp(v)}`, tw = t.length * 7 + 8, ty = Y(v);
    svg.append(s("rect", {x: mg.l + 2, y: ty - 8, width: tw, height: 16, rx: 3, fill: "var(--surface)", stroke: `var(${col})`, "stroke-width": 1}),
      s("text", {class: "lbl", x: mg.l + 6, y: ty + 4, style: `fill:var(${col})`}, t));
  };
  hline(x.pivot, "--pivot", null, "ピボット");

  // 出来高

  const Yv = v => vBot - v / vmax * H2;
  if (x.dry) {
    const a = Math.max(x.dry[0], i0), b = x.dry[1] - 1;
    if (b >= i0) svg.append(s("rect", {x: X(a) - sw / 2, y: vTop, width: X(b) - X(a) + sw, height: H2, fill: "var(--base)"}),
      s("text", {class: "ax", x: X(b) + sw / 2 - 2, y: vTop + 10, "text-anchor": "end"}, "細りを見た期間"));
  }
  for (let i = i0; i < len; i++) {
    const v = x.v[i]; if (!v) continue;
    const up = x.c[i] >= (x.o[i] ?? x.c[i - 1] ?? x.c[i]);
    svg.append(s("rect", {x: X(i) - bw / 2, y: Yv(v), width: bw, height: vBot - Yv(v), fill: up ? "var(--pos)" : "var(--neg)", opacity: .6}));
  }
  let d = "", on = false;
  for (let i = i0; i < len; i++) { const v = x.va[i]; if (v == null) { on = false; continue; } d += (on ? "L" : "M") + X(i).toFixed(1) + " " + Yv(v).toFixed(1); on = true; }
  svg.append(s("path", {d, fill: "none", stroke: "var(--fg2)", "stroke-width": 1.2}));
  svg.append(s("line", {x1: mg.l, x2: W - mg.r, y1: vBot, y2: vBot, stroke: "var(--axis)"}),
    s("text", {class: "ax", x: mg.l + 2, y: vTop + 10}, "出来高(線は50日平均)"));
  // 日付
  const nx = narrow ? 4 : 7;
  for (let k = 0; k < nx; k++) { const i = i0 + Math.round(k * (n - 1) / (nx - 1));
    svg.append(s("text", {class: "ax", x: X(i), y: H - 6, "text-anchor": k === 0 ? "start" : k === nx - 1 ? "end" : "middle"}, x.d[i].slice(2).replaceAll("-", "/"))); }
  const cross = s("line", {y1: pTop, y2: vBot, stroke: "var(--fg2)", visibility: "hidden"});
  svg.append(cross);
  wrap.replaceChildren(svg);
  CH = {x, i0, n, sw, ml: mg.l, cross, X};
}
function niceTicks(lo, hi, n) {
  const span = hi - lo, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(st => span / st <= n) || 10 * mag;
  const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) out.push(v);
  return out;
}
function hover(e) {
  if (!CH) return;
  const rect = $("#chart").getBoundingClientRect(), j = Math.floor((e.clientX - rect.left - CH.ml) / CH.sw);
  const tip = $("#tip");
  if (j < 0 || j >= CH.n) { CH.cross.setAttribute("visibility", "hidden"); tip.style.display = "none"; return; }
  const i = CH.i0 + j, x = CH.x, px = CH.X(i);
  CH.cross.setAttribute("x1", px); CH.cross.setAttribute("x2", px); CH.cross.setAttribute("visibility", "visible");
  const row = (a, b) => h("div", {class: "tr"}, h("span", null, a), h("span", null, b));
  tip.replaceChildren(h("div", {class: "tl"}, x.d[i]), row("始値", fp(x.o[i])), row("高値", fp(x.h[i])), row("安値", fp(x.l[i])), row("終値", fp(x.c[i])),
    row("出来高/50日平均", x.va[i] ? fx(x.v[i] / x.va[i], 2) + "倍" : "-"));
  tip.style.display = "block";
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  tip.style.left = clamp(e.clientX + 14, 4, innerWidth - tw - 4) + "px";
  tip.style.top = clamp(e.clientY + 14, 4, innerHeight - th - 4) + "px";

/* ---------- コピー ---------- */
function reviewText() {
  const lines = [`VCPスクリーニング検証 基準日 ${D.as_of}`];
  for (const x of stocks) { const r = review[x.code]; if (!r || (!r.mark && !r.memo)) continue;
    lines.push(`${x.code} ${x.name}【${x.vcp ? "VCP " + x.status : "不合格: " + x.reasons.join("、")}】 ${({ok: "妥当", ng: "要修正", q: "保留"})[r.mark] || "-"}${r.memo ? " / " + r.memo : ""}`); }
  return lines.length > 1 ? lines.join("\n") : "";
}
$("#copy").addEventListener("click", () => {
  const t = reviewText(), msg = $("#copy-msg"), pre = $("#copy-src");
  if (!t) { msg.textContent = "まだ印やメモがありません。"; return; }
  const fallback = () => { pre.hidden = false; pre.textContent = t; const r = document.createRange(); r.selectNodeContents(pre); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    msg.textContent = "コピーできなかったので、下に表示した文字を選択しました。手動でコピーしてください。"; };
  try { navigator.clipboard.writeText(t).then(() => { msg.textContent = "コピーしました。"; pre.hidden = true; }, fallback); } catch (e) { fallback(); }
});

document.querySelectorAll("#tabs button").forEach(b => b.addEventListener("click", () => {

document.addEventListener("pointermove", e => { if (e.target.closest && e.target.closest("#chart")) hover(e); else if (CH) { CH.cross.setAttribute("visibility", "hidden"); $("#tip").style.display = "none"; } });
let rz = 0; addEventListener("resize", () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => { if (state.code && state.tab !== "near") drawChart(byCode[state.code]); }); });
renderCounts();
renderList();
